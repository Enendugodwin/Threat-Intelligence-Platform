# threat-intel-pipeline configuration

feeds:
  urlhaus:
    enabled: true
    derive_domains: true   # also track the host domain of each malicious URL
    max_records: 5000      # newest N CSV rows per run (keeps exports and DB sane)
  feodo:
    enabled: true
  threatfox:
    enabled: true
  malwarebazaar:
    enabled: true
    max_records: 2000      # recent sample hashes
  openphish:
    enabled: true
    max_records: 1000      # current phishing URLs
  circl:
    enabled: true          # CIRCL MISP OSINT feed (public, keyless)
    max_events: 8
    max_attributes_per_event: 300
  tor:
    enabled: true
    exits_only: false   # true = keep only relays carrying the Exit flag
    max_records: 20000  # safety cap across paginated Onionoo requests
  otx:
    enabled: false         # set true and export OTX_API_KEY to use
    modified_since_days: 2
    max_pulses: 20

storage:
  prune_after_days: 45     # drop indicators not re-seen in this many days

exports:
  window_days: 30          # export lookback window
  max_rows: 30000          # hard cap for STIX/CSV/Sigma/Suricata exports
  min_confidence: 0
  # Sources kept out of STIX/Sigma/Suricata/CSV exports. Tor nodes are context,
  # not malware - they would only add noise to detections. The dedicated Tor
  # list is always written to dist/tor/tor_nodes.txt.
  exclude_sources: ["tor"]
  sigma:
    max_values_per_rule: 200
  suricata:
    max_rules: 1500
    sid_base: 9100000

report:
  window_days: 7
  top_n: 25
  tor_sample: 20
  repo_url: "https://github.com/Enendugodwin/Threat-Intelligence-Platform"

# Report feed: vendor advisories -> site pages with IOCs + recommendations
reports:
  enabled: true
  max_entries_per_source: 20
  max_reports: 150          # newest feed reports kept; curated reports are always kept
  max_iocs_per_report: 100
  detail_chars: 2500
  # Keywords surfaced as tags on report cards (matched case-insensitively).
  keywords: ["LockBit", "Akira", "RansomHub", "QakBot", "Emotet", "IcedID", "Pikabot", "DarkGate", "Latrodectus", "ClearFake", "Gootloader", "SocGholish", "Lumma", "RedLine", "Remcos", "AsyncRAT", "Cobalt Strike", "Metasploit", "Amatera", "Antino", "StealC", "Vidar", "Raccoon", "Mirai", "Androxgh0st", "Ransomware", "Infostealer", "Phishing", "Backdoor", "Botnet"]
  curated_file: intel/curated_reports.yaml
  recommendations_file: intel/recommendations.yaml
  sources:
    msrc:
      enabled: true
      name: Microsoft Security Blog
      url: https://www.microsoft.com/en-us/security/blog/feed/
      category: windows
    talos:
      enabled: true
      name: Cisco Talos
      url: https://blog.talosintelligence.com/rss/
      category: cisco
    unit42:
      enabled: true
      name: Palo Alto Unit 42
      url: https://unit42.paloaltonetworks.com/feed/
      category: paloalto
    ubuntu:
      enabled: true
      name: Ubuntu Security Notices
      url: https://ubuntu.com/security/notices/rss.xml
      category: linux
    dfir:
      enabled: true
      name: The DFIR Report
      url: https://thedfirreport.com/feed/
      category: windows
    sans_isc:
      enabled: true
      name: SANS ISC
      url: https://isc.sans.edu/rssfeed.xml
      category: general
    cisa:
      # Akamai edge returns 403 to Python clients (TLS fingerprint based);
      # browsers/curl/PowerShell may work from home IPs, but CI runners are
      # blocked too. Enable only if it works from your environment.
      enabled: false
      name: CISA Advisories
      url: https://www.cisa.gov/cybersecurity-advisories/all.xml
      category: general
  # Category shown for a report: title keywords win, then the source default.
  category_rules:
    windows: ["windows", "microsoft", "active directory", "kerberos", "ntlm", "powershell", "winrm", "lsass", "smb", "rdp", "exchange server", "sharepoint", "hyper-v"]
    linux: ["linux", "ubuntu", "debian", "red hat", "rhel", "centos", "fedora", "suse", "systemd", "kernel vulnerability", "openssh", "glibc", "container escape"]
    cisco: ["cisco", "ios xe", "ios xr", "firepower", "nexus", "talos", "webex", "anyconnect", "catalyst", "meraki", "sd-wan", "unified communications"]
    paloalto: ["palo alto", "paloalto", "pan-os", "panos", "unit 42", "unit42", "globalprotect", "panorama", "prisma access", "cortex xdr", "next-generation firewall"]

# Vulnerability intelligence (CISA KEV + FIRST EPSS scoring)
vulnintel:
  enabled: true
  max_entries: 200        # newest KEV entries kept and rendered

# Attack-origin geolocation (map page; ip-api.com, cached forever)
geo:
  enabled: true
  max_ips: 400            # lookups per run; cached after first lookup
  include_sources: ["threatfox", "feodo"]   # report-extracted IPs are always included
